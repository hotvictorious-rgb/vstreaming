<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Video Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: transparent;
            overflow: hidden;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
        }
        /* Fallback Flier Layer - Permanently Anchored Base (Revealed on true disconnect) */
        #flier-slate {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d081a;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            z-index: 1;
            opacity: 1; /* Always 100% visible base underneath, revealed on true disconnect */
            pointer-events: none;
        }
        /* Dual-Channel A/B Live Video Engines (True Broadcast Cross-Roll) */
        .obs-video-channel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s ease-out;
        }
        .obs-video-channel.instant-cut {
            transition: none !important;
        }
        .obs-video-channel.live {
            opacity: 1;
        }

        /* =====================================================================
           LIVE BROADCAST GRAPHICS & LOWER-THIRD OVERLAY (LAYER 10)
           ===================================================================== */
        #graphics-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 45px 50px;
        }

        .graphic-card {
            background: linear-gradient(135deg, rgba(20, 10, 42, 0.94) 0%, rgba(35, 16, 68, 0.90) 100%);
            border: 1px solid rgba(245, 158, 11, 0.45);
            border-left: 6px solid #f59e0b;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(124, 58, 237, 0.35);
            backdrop-filter: blur(20px);
            max-width: 960px;
            min-width: 440px;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: translateX(-120%);
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }

        .graphic-card.active {
            transform: translateX(0);
            opacity: 1;
        }

        .graphic-card.hiding {
            transform: translateY(25px);
            opacity: 0;
            transition: transform 0.3s ease-in, opacity 0.25s ease-in;
        }

        .graphic-badge-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .graphic-icon {
            font-size: 20px;
            filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
        }

        .graphic-badge-title {
            color: #fbbf24;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .graphic-badge-tag {
            background: rgba(124, 58, 237, 0.35);
            border: 1px solid rgba(139, 92, 246, 0.6);
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .graphic-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: opacity 0.18s ease-in-out;
        }

        .graphic-main-text {
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.2px;
        }

        .graphic-sub-text {
            color: #cbd5e1;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        /* Multi-Layout Overlay Styles */
        /* Style A: Lower-Center (Worship leader on camera visible above, lyrics centered below) */
        #graphics-layer.layout-center-slate,
        #graphics-layer.layout-lower-center {
            display: flex !important;
            justify-content: center !important;
            align-items: flex-end !important;
            padding: 0 0 50px 0 !important;
            inset: 0 !important;
        }
        #graphics-layer.layout-center-slate .graphic-card,
        #graphics-layer.layout-lower-center .graphic-card {
            max-width: 1240px !important;
            width: 88% !important;
            margin: 0 auto !important;
            text-align: center !important;
            align-items: center !important;
            border-left: 1px solid rgba(56, 189, 248, 0.45) !important;
            border-top: 5px solid #38bdf8 !important;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), 0 0 30px rgba(56, 189, 248, 0.3) !important;
            border-radius: 14px !important;
            padding: 22px 36px !important;
            transform: translateY(120%) !important;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease !important;
        }
        #graphics-layer.layout-center-slate .graphic-card.active,
        #graphics-layer.layout-lower-center .graphic-card.active {
            transform: translateY(0) !important;
            opacity: 1 !important;
        }
        #graphics-layer.layout-center-slate .graphic-badge-row,
        #graphics-layer.layout-lower-center .graphic-badge-row {
            justify-content: center !important;
        }
        #graphics-layer.layout-center-slate .graphic-content,
        #graphics-layer.layout-lower-center .graphic-content {
            align-items: center !important;
            width: 100% !important;
        }
        #graphics-layer.layout-center-slate .graphic-main-text,
        #graphics-layer.layout-lower-center .graphic-main-text {
            font-size: 32px !important;
            line-height: 1.45 !important;
            font-weight: 700 !important;
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
            letter-spacing: 0.3px !important;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.8) !important;
        }
        #graphics-layer.layout-center-slate .graphic-sub-text,
        #graphics-layer.layout-lower-center .graphic-sub-text {
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
        }

        /* Style B: Full-Center / Full-Screen Edge-to-Edge Sanctuary Worship Slide */
        #graphics-layer.layout-full-center {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: 0 !important;
            inset: 0 !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: transparent !important;
        }
        #graphics-layer.layout-full-center .graphic-card {
            max-width: 100vw !important;
            width: 100vw !important;
            min-width: 100vw !important;
            max-height: 100vh !important;
            height: 100vh !important;
            min-height: 100vh !important;
            margin: 0 !important;
            inset: 0 !important;
            border-radius: 0 !important;
            text-align: center !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            background: linear-gradient(135deg, rgba(8, 4, 20, 0.98) 0%, rgba(20, 9, 44, 0.97) 100%) !important;
            border: none !important;
            border-top: 8px solid #38bdf8 !important;
            border-bottom: 8px solid #f59e0b !important;
            padding: 60px 100px !important;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.95) !important;
            backdrop-filter: blur(30px) !important;
            transform: scale(0.98) !important;
            opacity: 0 !important;
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        #graphics-layer.layout-full-center .graphic-card.active {
            transform: scale(1) !important;
            opacity: 1 !important;
        }
        #graphics-layer.layout-full-center .graphic-card.hiding {
            transform: scale(0.98) !important;
            opacity: 0 !important;
            transition: opacity 0.2s ease, transform 0.2s ease !important;
        }
        #graphics-layer.layout-full-center .graphic-badge-row {
            justify-content: center !important;
            margin-bottom: 16px !important;
        }
        #graphics-layer.layout-full-center .graphic-badge-title {
            font-size: 18px !important;
            letter-spacing: 2.5px !important;
        }
        #graphics-layer.layout-full-center .graphic-content {
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            max-width: 1540px !important;
            margin: 0 auto !important;
        }
        #graphics-layer.layout-full-center .graphic-main-text {
            font-size: 50px !important;
            line-height: 1.45 !important;
            font-weight: 700 !important;
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
            letter-spacing: 0.5px !important;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 1), 0 0 28px rgba(0, 0, 0, 0.9) !important;
        }
        #graphics-layer.layout-full-center .graphic-sub-text {
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
            font-size: 20px !important;
            margin-top: 14px !important;
        }

        #graphics-layer.layout-ticker {
            padding: 0;
            align-items: flex-end;
        }
        #graphics-layer.layout-ticker .graphic-card {
            max-width: 100vw;
            width: 100vw;
            min-width: 100vw;
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
            border-top: 4px solid #f59e0b;
            padding: 12px 50px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }
        #graphics-layer.layout-ticker .graphic-content {
            flex-direction: row;
            align-items: center;
            gap: 20px;
            flex: 1;
        }
        #graphics-layer.layout-ticker .graphic-main-text {
            font-size: 20px;
        }
        #graphics-layer.layout-ticker .graphic-sub-text {
            font-size: 15px;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <!-- Permanent Church Flier Slate (Base Layer - z-index: 1) -->
    <div id="flier-slate"></div>

    <!-- Dual-Channel A/B Live Video Engines (Layer 2 & 3 - Seamless Live-to-Live Roll) -->
    <video id="video-a" class="obs-video-channel" autoplay playsinline muted></video>
    <video id="video-b" class="obs-video-channel" autoplay playsinline muted></video>

    <!-- Live Broadcast Graphics & Lower-Third Layer (Layer 10) -->
    <div id="graphics-layer">
        <div id="graphic-card" class="graphic-card">
            <div class="graphic-badge-row" id="graphic-badge-row">
                <span class="graphic-icon" id="graphic-icon">👤</span>
                <span class="graphic-badge-title" id="graphic-badge-title">SPEAKER</span>
                <span class="graphic-badge-tag" id="graphic-badge-tag">LIVE</span>
            </div>
            <div class="graphic-content" id="graphic-content">
                <div class="graphic-main-text" id="graphic-main-text"></div>
                <div class="graphic-sub-text" id="graphic-sub-text"></div>
            </div>
        </div>
    </div>

    <script>

        // =====================================================================
        // LIVE BROADCAST GRAPHICS CONTROLLER (LOWER-THIRDS & SCRIPTURES)
        // =====================================================================
        let overlayHideTimer = null;

        function showGraphicOverlay(payload) {
            // =================================================================
            // IMPENETRABLE AIR-SAFETY SHIELD: NEVER PROJECT ERROR MESSAGES!
            // =================================================================
            if (payload) {
                const combined = `${payload.mainText || ''} ${payload.subText || ''} ${payload.badgeTitle || ''} ${payload.badgeTag || ''}`;
                if (/(could not load|failed to|error|please edit manually|out of bounds|undefined|null)/i.test(combined)) {
                    console.warn('[OBS Air Safety] Blocked projection containing error text:', combined);
                    hideGraphicOverlay();
                    return;
                }
            }
            if (isEmergency) return; // Never show over emergency flier
            if (overlayHideTimer) {
                clearTimeout(overlayHideTimer);
                overlayHideTimer = null;
            }

            const layer = document.getElementById('graphics-layer');
            const card = document.getElementById('graphic-card');
            if (layer) {
                const layout = payload.layout || 'lower-third';
                layer.className = 'layout-' + layout;
            }
            const icon = document.getElementById('graphic-icon');
            const title = document.getElementById('graphic-badge-title');
            const tag = document.getElementById('graphic-badge-tag');
            const main = document.getElementById('graphic-main-text');
            const sub = document.getElementById('graphic-sub-text');

            if (!card) return;

            const badgeRow = document.getElementById('graphic-badge-row');
            if (payload.template === 'hymn') {
                // Completely hide title and stanza on screen: ONLY LYRICS ARE BROADCAST!
                if (badgeRow) badgeRow.style.display = 'none';
            } else {
                if (badgeRow) badgeRow.style.display = 'flex';
                icon.innerText = payload.icon || '🎬';
                title.innerText = payload.badgeTitle || 'BROADCAST';
                tag.innerText = payload.badgeTag || '';
                tag.style.display = payload.badgeTag ? 'inline-block' : 'none';
            }

            main.innerText = payload.mainText || '';
            main.style.display = payload.mainText ? 'block' : 'none';
            main.style.whiteSpace = 'pre-line';

            sub.innerText = payload.subText || '';
            sub.style.display = (payload.template === 'hymn' || !payload.subText) ? 'none' : 'block';
            sub.style.whiteSpace = 'pre-line';

            // Distinct theme borders and font sizing per template & layout
            const isFullCenter = (payload.layout === 'full-center');
            const isLowerCenter = (payload.layout === 'center-slate' || payload.layout === 'lower-center');

            if (isFullCenter) {
                card.style.borderLeft = 'none';
                card.style.borderRight = 'none';
                card.style.borderRadius = '0';
                if (payload.template === 'scripture') {
                    // Biblical Royal Gold top & Imperial Purple bottom
                    card.style.borderTop = '8px solid #f59e0b';
                    card.style.borderBottom = '8px solid #7c3aed';
                } else {
                    card.style.borderTop = '8px solid #38bdf8';
                    card.style.borderBottom = '8px solid #f59e0b';
                }

                // Dynamic Auto-Fit Font Sizing for Full-Screen
                const charLen = (payload.mainText || '').length;
                if (payload.template === 'scripture') {
                    if (charLen <= 130) {
                        main.style.fontSize = '50px';
                        main.style.lineHeight = '1.45';
                    } else if (charLen <= 260) {
                        main.style.fontSize = '42px';
                        main.style.lineHeight = '1.45';
                    } else if (charLen <= 420) {
                        main.style.fontSize = '35px';
                        main.style.lineHeight = '1.4';
                    } else {
                        main.style.fontSize = '30px';
                        main.style.lineHeight = '1.35';
                    }
                } else {
                    main.style.fontSize = '50px';
                    main.style.lineHeight = '1.45';
                }
            } else if (isLowerCenter) {
                card.style.borderBottom = 'none';
                card.style.borderRight = 'none';
                card.style.borderRadius = '16px';
                if (payload.template === 'scripture') {
                    card.style.borderLeft = '1px solid rgba(245, 158, 11, 0.45)';
                    card.style.borderTop = '6px solid #f59e0b';
                } else {
                    card.style.borderLeft = '1px solid rgba(56, 189, 248, 0.45)';
                    card.style.borderTop = '5px solid #38bdf8';
                }

                // Dynamic Auto-Fit Font Sizing for Lower-Center
                const charLen = (payload.mainText || '').length;
                if (payload.template === 'scripture') {
                    if (charLen <= 140) {
                        main.style.fontSize = '32px';
                        main.style.lineHeight = '1.4';
                    } else if (charLen <= 260) {
                        main.style.fontSize = '27px';
                        main.style.lineHeight = '1.35';
                    } else {
                        main.style.fontSize = '23px';
                        main.style.lineHeight = '1.3';
                    }
                } else {
                    main.style.fontSize = '32px';
                    main.style.lineHeight = '1.45';
                }
            } else {
                card.style.borderTop = 'none';
                card.style.borderBottom = 'none';
                card.style.borderRight = 'none';
                card.style.borderRadius = '14px';
                if (payload.template === 'scripture') {
                    card.style.borderLeft = '6px solid #f59e0b';
                    const charLen = (payload.mainText || '').length;
                    main.style.fontSize = (charLen <= 140) ? '26px' : '22px';
                } else if (payload.template === 'hymn') {
                    card.style.borderLeft = '6px solid #38bdf8';
                    main.style.fontSize = '28px';
                } else if (payload.template === 'giving') {
                    card.style.borderLeft = '6px solid #10b981';
                    main.style.fontSize = '26px';
                } else {
                    card.style.borderLeft = '6px solid #f59e0b';
                    main.style.fontSize = '26px';
                }
            }

            const isAlreadyActive = card.classList.contains('active');
            if (isAlreadyActive) {
                const gContent = document.getElementById('graphic-content');
                if (gContent) {
                    gContent.style.opacity = '0.2';
                    setTimeout(() => {
                        gContent.style.opacity = '1';
                    }, 120);
                }
            }

            card.classList.remove('hiding');
            card.classList.add('active');

            if (payload.autoHideSeconds && payload.autoHideSeconds > 0) {
                overlayHideTimer = setTimeout(() => {
                    hideGraphicOverlay();
                }, payload.autoHideSeconds * 1000);
            }
        }

        function hideGraphicOverlay() {
            if (overlayHideTimer) {
                clearTimeout(overlayHideTimer);
                overlayHideTimer = null;
            }
            const card = document.getElementById('graphic-card');
            if (card && card.classList.contains('active')) {
                card.classList.add('hiding');
                setTimeout(() => {
                    card.classList.remove('active');
                    card.classList.remove('hiding');
                }, 350);
            }
        }

                const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || urlParams.get('mode') || urlParams.get('cam') || '1';
        const isProgramMode = (idParam === 'program' || idParam === 'live' || urlParams.get('mode') === 'program' || urlParams.get('mode') === 'live');
        let camId = isProgramMode ? 'program' : parseInt(idParam, 10);
        let currentProgramCamId = null; // Master Program starts safely on Church Flier
        let activeTallyState = 'OFF_AIR'; // Strict Broadcast Gate: Only 'PROGRAM' is permitted on air

        const flierSlate = document.getElementById('flier-slate');

        // Dual-Channel A/B Video Pipeline (Live-to-Live Seamless Handoff)
        const channelA = {
            id: 'A',
            videoEl: document.getElementById('video-a'),
            pc: null,
            candidateQueue: [],
            camId: null,
            receiverId: null,
            muteTimeout: null
        };

        const channelB = {
            id: 'B',
            videoEl: document.getElementById('video-b'),
            pc: null,
            candidateQueue: [],
            camId: null,
            receiverId: null,
            muteTimeout: null
        };

        let activeChannel = null;   // The channel currently on-air (null if on Church Flier)
        let pendingChannel = null;  // The channel currently pre-connecting in the background
        let cameraAudioEnabled = {}; // Map of camId -> boolean (Director audio passthrough authorization)
        let isEmergency = false;
        let isStreamActive = false;
        let handshakeTimeout = null;
        let ws = null;

        // Robust RTC Configuration with STUN for LAN/Wi-Fi mDNS discovery
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        // Fetch Initial Church Flier Slate
        async function loadFlier() {
            try {
                const res = await fetch('/api/flier-status');
                const data = await res.json();
                if (data.url) {
                    flierSlate.style.backgroundImage = `url("${data.url}")`;
                }
                if (data.isEmergencyCut) {
                    setEmergency(true, true);
                }
            } catch (e) {
                flierSlate.style.backgroundImage = 'url("/assets/default_flier.svg")';
            }
        }
        loadFlier();

        // Dismantle a single video channel cleanly without disturbing the on-air feed
        function teardownChannel(channel) {
            if (!channel) return;
            if (channel.muteTimeout) {
                clearTimeout(channel.muteTimeout);
                channel.muteTimeout = null;
            }
            if (channel.pc) {
                try {
                    channel.pc.oniceconnectionstatechange = null;
                    channel.pc.ontrack = null;
                    channel.pc.onicecandidate = null;
                    channel.pc.close();
                } catch (e) {}
                channel.pc = null;
            }
            if (channel.videoEl && channel.videoEl.srcObject) {
                try {
                    const stream = channel.videoEl.srcObject;
                    stream.getTracks().forEach(t => {
                        t.onended = null;
                        t.onmute = null;
                        t.onunmute = null;
                        t.stop();
                    });
                } catch (e) {}
                channel.videoEl.srcObject = null;
            }
            channel.candidateQueue = [];
            channel.camId = null;
            channel.receiverId = null;
        }

        // Reveal the permanent church flier slate (drops both video layers)
        function fallbackToFlier(immediate = false) {
            isStreamActive = false;
            if (channelA.videoEl) {
                if (immediate) channelA.videoEl.classList.add('instant-cut');
                channelA.videoEl.classList.remove('live');
                if (immediate) setTimeout(() => channelA.videoEl.classList.remove('instant-cut'), 50);
            }
            if (channelB.videoEl) {
                if (immediate) channelB.videoEl.classList.add('instant-cut');
                channelB.videoEl.classList.remove('live');
                if (immediate) setTimeout(() => channelB.videoEl.classList.remove('instant-cut'), 50);
            }
        }

        function setEmergency(active, immediate = true) {
            isEmergency = active;
            if (active) {
                if (handshakeTimeout) { clearTimeout(handshakeTimeout); handshakeTimeout = null; }
                if (pendingChannel) { teardownChannel(pendingChannel); pendingChannel = null; }
                if (activeChannel) {
                    teardownChannel(activeChannel);
                    activeChannel = null;
                }
                fallbackToFlier(immediate);
            } else if (isProgramMode && currentProgramCamId && activeTallyState === 'PROGRAM') {
                requestStream(currentProgramCamId);
            }
        }

        // Promote the pending channel to ON-AIR ("POOF" Instant Cut from motion to motion!)
        function promotePendingToLive() {
            if (!pendingChannel) return;

            const incoming = pendingChannel;
            const outgoing = activeChannel;

            console.log(`[A/B Switcher] POOF! Cutting LIVE from ${outgoing ? 'Channel ' + outgoing.id : 'Flier'} to Channel ${incoming.id} (Camera ${incoming.camId})`);

            // Strict Gate: Never reveal video if in Emergency or not authorized for PROGRAM
            if (isEmergency || activeTallyState !== 'PROGRAM') {
                fallbackToFlier(true);
                return;
            }

            if (handshakeTimeout) {
                clearTimeout(handshakeTimeout);
                handshakeTimeout = null;
            }

            // Elevate incoming channel above the outgoing channel / flier
            incoming.videoEl.style.zIndex = '3';
            incoming.videoEl.classList.add('live');

            // Apply Audio Muting / Passthrough based on Director authorization
            const audioAllowed = !!cameraAudioEnabled[incoming.camId];
            incoming.videoEl.muted = !audioAllowed;

            activeChannel = incoming;
            pendingChannel = null;
            isStreamActive = true;

            // Dismantle outgoing channel cleanly after incoming is safely painting
            if (outgoing && outgoing !== incoming) {
                setTimeout(() => {
                    outgoing.videoEl.classList.remove('live');
                    outgoing.videoEl.style.zIndex = '2';
                    teardownChannel(outgoing);
                }, 50);
            }
        }

        // Request a camera feed on the alternate A/B channel (Zero Freeze!)
        function requestStream(targetCam) {
            const targetId = targetCam || (isProgramMode ? currentProgramCamId : camId);
            if (!targetId || activeTallyState !== 'PROGRAM' || isEmergency) {
                fallbackToFlier(true);
                return;
            }

            // If the requested camera is already live on air, avoid redundant reconnection
            if (activeChannel && activeChannel.camId === targetId && isStreamActive && activeChannel.videoEl.videoWidth > 0) {
                console.log(`[A/B Switcher] Camera ${targetId} is already active on Channel ${activeChannel.id}`);
                return;
            }

            // Select the inactive channel to negotiate incoming stream in the background
            const nextChannel = (activeChannel === channelA) ? channelB : channelA;

            // Clean up any stale state on the candidate channel
            teardownChannel(nextChannel);

            pendingChannel = nextChannel;
            pendingChannel.camId = targetId;
            pendingChannel.receiverId = (isProgramMode ? `obs_prog_${pendingChannel.id}_` : `obs_${camId}_`) + Math.random().toString(36).substring(2, 7);

            console.log(`[A/B Switcher] Pre-connecting Camera ${targetId} on Channel ${pendingChannel.id} (Receiver: ${pendingChannel.receiverId}). Active on air: ${activeChannel ? 'Channel ' + activeChannel.id : 'Flier'}`);

            // Handshake safety timeout (3500ms) - Gives Wi-Fi WebRTC ICE & DTLS negotiation time to paint frames
            if (handshakeTimeout) clearTimeout(handshakeTimeout);
            handshakeTimeout = setTimeout(() => {
                if (pendingChannel && pendingChannel.camId === targetId) {
                    console.warn(`[A/B Switcher] Camera ${targetId} handshake timed out (3500ms)`);
                    teardownChannel(pendingChannel);
                    pendingChannel = null;

                    // If active channel was playing live, keep it live! (Audience sees zero freeze!)
                    if (activeChannel && activeChannel.camId && isStreamActive && activeChannel.videoEl.videoWidth > 0) {
                        console.log(`[A/B Switcher] Preserved live broadcast on Channel ${activeChannel.id} (Camera ${activeChannel.camId})`);
                        currentProgramCamId = activeChannel.camId;
                    } else {
                        fallbackToFlier(true);
                    }
                }
            }, 3500);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'receiver_ready',
                    camId: targetId,
                    receiverId: pendingChannel.receiverId
                }));
            }
        }

        function initWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${window.location.host}`);

            ws.onopen = async () => {
                console.log(`[OBS Receiver] Connected as ${isProgramMode ? 'Master Program Switcher (A/B Cross-Roll)' : 'Receiver for Cam ' + camId}`);
                ws.send(JSON.stringify({
                    type: 'register',
                    role: isProgramMode ? 'program_receiver' : 'receiver',
                    camId: isProgramMode ? 'program' : camId,
                    receiverId: isProgramMode ? 'obs_program_master' : `obs_${camId}`
                }));

                // Check initial authoritative Tally state from server
                try {
                    const res = await fetch('/api/info');
                    const info = await res.json();
                    if (isProgramMode) {
                        if (info.currentProgramCamId && info.cameras[info.currentProgramCamId] && info.cameras[info.currentProgramCamId].tally === 'PROGRAM') {
                            currentProgramCamId = info.currentProgramCamId;
                            activeTallyState = 'PROGRAM';
                            requestStream(currentProgramCamId);
                        } else {
                            currentProgramCamId = null;
                            activeTallyState = 'OFF_AIR';
                            fallbackToFlier(true);
                        }
                    } else {
                        if (info.cameras[camId] && info.cameras[camId].tally === 'PROGRAM') {
                            activeTallyState = 'PROGRAM';
                            requestStream(camId);
                        } else {
                            activeTallyState = info.cameras[camId]?.tally || 'OFF_AIR';
                            fallbackToFlier(true);
                        }
                    }
                } catch (e) {
                    fallbackToFlier(true);
                }
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // Flier Image Updated
                    if (data.type === 'flier_updated') {
                        flierSlate.style.backgroundImage = `url("${data.url}")`;
                    }

                    // Live Graphics & Lower-Third Overlay Commands
                    if (data.type === 'overlay_show') {
                        showGraphicOverlay(data);
                    }
                    if (data.type === 'overlay_hide') {
                        hideGraphicOverlay();
                    }

                    // Emergency Panic Cut (Instant Hard Cut to Flier)
                    if (data.type === 'emergency_cut') {
                        if (data.url) flierSlate.style.backgroundImage = `url("${data.url}")`;
                        setEmergency(data.active, true);
                        if (data.active) {
                            hideGraphicOverlay();
                        }
                    }

                    // Master Program Cut Event (Director pressed CUT LIVE or server signaled program switch)
                    if (data.type === 'program_cut' && isProgramMode) {
                        const nextCamId = data.camId ? parseInt(data.camId, 10) : null;

                        // Case 1: Program taken off-air or cut to Church Flier
                        if (!nextCamId) {
                            console.log('[OBS Master Program] Program off-air -> Showing Church Flier slate');
                            currentProgramCamId = null;
                            activeTallyState = 'OFF_AIR';
                            if (handshakeTimeout) { clearTimeout(handshakeTimeout); handshakeTimeout = null; }
                            if (pendingChannel) { teardownChannel(pendingChannel); pendingChannel = null; }
                            if (activeChannel) {
                                teardownChannel(activeChannel);
                                activeChannel = null;
                            }
                            fallbackToFlier(true);
                            return;
                        }

                        // Case 2: Cut to Camera across any of Cam 1..6
                        currentProgramCamId = nextCamId;
                        activeTallyState = 'PROGRAM';
                        console.log(`[OBS Master Program] Cut command received for Camera ${currentProgramCamId}`);
                        requestStream(currentProgramCamId);
                    }

                    // Direct Tally Update from Director
                    if (data.type === 'tally_update') {
                        const updateCam = parseInt(data.camId, 10);
                        if (!isProgramMode) {
                            if (updateCam === camId) {
                                activeTallyState = data.state;
                                if (activeTallyState === 'PROGRAM') {
                                    console.log(`[OBS Receiver] Camera ${data.camId} cut to PROGRAM!`);
                                    requestStream(data.camId);
                                } else {
                                    console.log(`[OBS Receiver] Camera ${data.camId} demoted to ${data.state} -> Church Flier`);
                                    if (activeChannel) {
                                        teardownChannel(activeChannel);
                                        activeChannel = null;
                                    }
                                    if (pendingChannel) {
                                        teardownChannel(pendingChannel);
                                        pendingChannel = null;
                                    }
                                    fallbackToFlier(true);
                                }
                            }
                        }
                    }

                    // Broadcaster Came Online
                    if (data.type === 'broadcaster_online') {
                        const onlineId = parseInt(data.camId, 10);
                        if (!isProgramMode && onlineId === camId && activeTallyState === 'PROGRAM') {
                            requestStream(camId);
                        } else if (isProgramMode && onlineId === currentProgramCamId && activeTallyState === 'PROGRAM') {
                            requestStream(currentProgramCamId);
                        }
                    }

                    // Broadcaster Suspended or Went Offline (Phone locked, signal dropped, app closed, battery dead)
                    if (data.type === 'broadcaster_offline' || data.type === 'broadcaster_suspended') {
                        const targetId = parseInt(data.camId, 10);
                        if ((!isProgramMode && targetId === camId) || (isProgramMode && (targetId === currentProgramCamId || (activeChannel && activeChannel.camId === targetId)))) {
                            console.warn(`[OBS Receiver] Active Camera ${targetId} lost signal / went offline -> Instant Fallback to Church Flier`);
                            activeTallyState = 'OFF_AIR';
                            currentProgramCamId = null;
                            if (handshakeTimeout) { clearTimeout(handshakeTimeout); handshakeTimeout = null; }
                            if (pendingChannel && pendingChannel.camId === targetId) {
                                teardownChannel(pendingChannel);
                                pendingChannel = null;
                            }
                            if (activeChannel && activeChannel.camId === targetId) {
                                teardownChannel(activeChannel);
                                activeChannel = null;
                            }
                            fallbackToFlier(true);
                        }
                    }

                    // WebRTC Signaling: Offer
                    if (data.type === 'offer') {
                        const isMatchPending = pendingChannel && (data.receiverId === pendingChannel.receiverId || !data.receiverId || data.receiverId === 'obs_program_master' || (data.receiverId && data.receiverId.includes(`obs_prog_${pendingChannel.id}_`)));
                        const isMatchActive = activeChannel && (data.receiverId === activeChannel.receiverId || !data.receiverId || (data.receiverId && data.receiverId.includes(`obs_prog_${activeChannel.id}_`)));

                        if (isMatchPending) {
                            console.log(`[A/B Switcher] Routing Offer to Pending Channel ${pendingChannel.id}`);
                            await handleOffer(pendingChannel, data.sdp);
                        } else if (isMatchActive) {
                            console.log(`[A/B Switcher] Re-negotiating Active Channel ${activeChannel.id}`);
                            await handleOffer(activeChannel, data.sdp);
                        }
                    }

                    // WebRTC Signaling: ICE Candidate
                    if (data.type === 'ice-candidate') {
                        const isMatchPending = pendingChannel && (data.receiverId === pendingChannel.receiverId || !data.receiverId || data.receiverId === 'obs_program_master' || (data.receiverId && data.receiverId.includes(`obs_prog_${pendingChannel.id}_`)));
                        const isMatchActive = activeChannel && (data.receiverId === activeChannel.receiverId || !data.receiverId || (data.receiverId && data.receiverId.includes(`obs_prog_${activeChannel.id}_`)));

                        if (isMatchPending) {
                            await queueOrAddCandidate(pendingChannel, data.candidate);
                        } else if (isMatchActive) {
                            await queueOrAddCandidate(activeChannel, data.candidate);
                        }
                    }

                    // Director Audio Passthrough to OBS Toggle
                    if (data.type === 'set_obs_audio') {
                        const targetId = parseInt(data.camId, 10);
                        cameraAudioEnabled[targetId] = !!data.enabled;
                        console.log(`[OBS Audio] Camera ${targetId} audio passthrough set to: ${cameraAudioEnabled[targetId] ? 'LIVE' : 'MUTED'}`);
                        if (activeChannel && activeChannel.camId === targetId) {
                            activeChannel.videoEl.muted = !cameraAudioEnabled[targetId];
                        }
                    }

                } catch (e) {
                    console.error('[OBS WS Message Error]', e);
                }
            };

            ws.onclose = () => {
                fallbackToFlier(true);
                setTimeout(initWebSocket, 2000);
            };
        }

        // WebRTC Offer Handler for specific A/B channel
        async function handleOffer(channel, sdp) {
            if (!channel) return;
            if (activeTallyState !== 'PROGRAM' || (isProgramMode && !currentProgramCamId)) {
                console.warn('[A/B Switcher] Offer rejected: Receiver is not cut to PROGRAM');
                fallbackToFlier(true);
                return;
            }

            if (channel.pc) {
                try { channel.pc.close(); } catch (e) {}
            }

            channel.candidateQueue = [];
            channel.pc = new RTCPeerConnection(rtcConfig);
            channel.videoEl.muted = true;

            channel.videoEl.onplaying = () => {
                clearTimeout(channel.muteTimeout);
                console.log(`[A/B Switcher] Channel ${channel.id} video playback active for Cam ${channel.camId}`);
                if ('requestVideoFrameCallback' in channel.videoEl) {
                    channel.videoEl.requestVideoFrameCallback(() => {
                        promotePendingToLive();
                    });
                } else {
                    setTimeout(() => {
                        promotePendingToLive();
                    }, 40);
                }
            };

            channel.videoEl.onloadeddata = () => {
                channel.videoEl.muted = true;
                channel.videoEl.play().catch(e => console.warn(e));
            };

            channel.pc.ontrack = (event) => {
                console.log(`[A/B Switcher] Video Track received for Channel ${channel.id}!`);
                channel.videoEl.srcObject = event.streams[0];
                channel.videoEl.muted = true;
                channel.videoEl.play().catch(e => console.warn('Play interrupted:', e));

                event.streams[0].getVideoTracks().forEach(track => {
                    track.onended = () => {
                        console.log(`[A/B Switcher] Track Ended on Channel ${channel.id}`);
                        if (activeChannel === channel) {
                            console.warn(`[A/B Switcher] Active on-air Camera ${channel.camId} ended -> Instant Church Flier`);
                            teardownChannel(channel);
                            activeChannel = null;
                            currentProgramCamId = null;
                            fallbackToFlier(true);
                        }
                    };

                    track.onmute = () => {
                        clearTimeout(channel.muteTimeout);
                        channel.muteTimeout = setTimeout(() => {
                            if ((track.readyState === 'ended' || track.muted) && activeChannel === channel) {
                                console.warn(`[A/B Switcher] Active on-air Camera ${channel.camId} muted -> Instant Church Flier`);
                                teardownChannel(channel);
                                activeChannel = null;
                                currentProgramCamId = null;
                                fallbackToFlier(false);
                            }
                        }, 500);
                    };

                    track.onunmute = () => {
                        clearTimeout(channel.muteTimeout);
                    };
                });
            };

            channel.pc.oniceconnectionstatechange = () => {
                console.log(`[A/B Switcher ICE State - Channel ${channel.id}] ${channel.pc.iceConnectionState}`);
                if (['disconnected', 'failed', 'closed'].includes(channel.pc.iceConnectionState)) {
                    if (activeChannel === channel) {
                        console.warn(`[A/B Switcher] Active on-air Camera ${channel.camId} ICE dropped -> Instant Church Flier`);
                        teardownChannel(channel);
                        activeChannel = null;
                        currentProgramCamId = null;
                        fallbackToFlier(true);
                    }
                }
            };

            channel.pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'ice-candidate',
                        camId: channel.camId,
                        receiverId: channel.receiverId,
                        candidate: event.candidate
                    }));
                }
            };

            await channel.pc.setRemoteDescription(new RTCSessionDescription(sdp));

            while (channel.candidateQueue.length > 0) {
                const cand = channel.candidateQueue.shift();
                try {
                    await channel.pc.addIceCandidate(cand);
                } catch (err) {
                    console.warn('Candidate add error:', err);
                }
            }

            const answer = await channel.pc.createAnswer();
            await channel.pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
                type: 'answer',
                camId: channel.camId,
                receiverId: channel.receiverId,
                sdp: channel.pc.localDescription
            }));
        }

        async function queueOrAddCandidate(channel, candidate) {
            if (!candidate || !channel) return;
            const iceCandidate = new RTCIceCandidate(candidate);
            if (channel.pc && channel.pc.remoteDescription && channel.pc.remoteDescription.type) {
                try {
                    await channel.pc.addIceCandidate(iceCandidate);
                } catch (e) {
                    console.warn('Add Candidate Error:', e);
                }
            } else {
                channel.candidateQueue.push(iceCandidate);
            }
        }

        initWebSocket();
    </script>
