<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Video Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: transparent;
            overflow: hidden;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
        }
        /* Fallback Flier Layer - Permanently Anchored Base (Rock-Solid, ZERO Blinking) */
        #flier-slate {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d081a;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            z-index: 1;
            opacity: 1; /* Always 100% visible, never toggles opacity, never blinks */
            pointer-events: none;
        }
        /* Live Video Stream Layer - Floats directly on top of Flier Slate */
        #obs-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }
        #obs-video.instant-cut {
            transition: none !important;
        }
        #obs-video.live {
            opacity: 1;
        }

        /* =====================================================================
           LIVE BROADCAST GRAPHICS & LOWER-THIRD OVERLAY (LAYER 10)
           ===================================================================== */
        #graphics-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 45px 50px;
        }

        .graphic-card {
            background: linear-gradient(135deg, rgba(20, 10, 42, 0.94) 0%, rgba(35, 16, 68, 0.90) 100%);
            border: 1px solid rgba(245, 158, 11, 0.45);
            border-left: 6px solid #f59e0b;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(124, 58, 237, 0.35);
            backdrop-filter: blur(20px);
            max-width: 960px;
            min-width: 440px;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: translateX(-120%);
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }

        .graphic-card.active {
            transform: translateX(0);
            opacity: 1;
        }

        .graphic-card.hiding {
            transform: translateY(25px);
            opacity: 0;
            transition: transform 0.3s ease-in, opacity 0.25s ease-in;
        }

        .graphic-badge-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .graphic-icon {
            font-size: 20px;
            filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
        }

        .graphic-badge-title {
            color: #fbbf24;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .graphic-badge-tag {
            background: rgba(124, 58, 237, 0.35);
            border: 1px solid rgba(139, 92, 246, 0.6);
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .graphic-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: opacity 0.18s ease-in-out;
        }

        .graphic-main-text {
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.2px;
        }

        .graphic-sub-text {
            color: #cbd5e1;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        /* Multi-Layout Overlay Styles */
        /* Style A: Lower-Center (Worship leader on camera visible above, lyrics centered below) */
        #graphics-layer.layout-center-slate,
        #graphics-layer.layout-lower-center {
            display: flex !important;
            justify-content: center !important;
            align-items: flex-end !important;
            padding: 0 0 50px 0 !important;
            inset: 0 !important;
        }
        #graphics-layer.layout-center-slate .graphic-card,
        #graphics-layer.layout-lower-center .graphic-card {
            max-width: 1240px !important;
            width: 88% !important;
            margin: 0 auto !important;
            text-align: center !important;
            align-items: center !important;
            border-left: 1px solid rgba(56, 189, 248, 0.45) !important;
            border-top: 5px solid #38bdf8 !important;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), 0 0 30px rgba(56, 189, 248, 0.3) !important;
            border-radius: 14px !important;
            padding: 22px 36px !important;
            transform: translateY(120%) !important;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease !important;
        }
        #graphics-layer.layout-center-slate .graphic-card.active,
        #graphics-layer.layout-lower-center .graphic-card.active {
            transform: translateY(0) !important;
            opacity: 1 !important;
        }
        #graphics-layer.layout-center-slate .graphic-badge-row,
        #graphics-layer.layout-lower-center .graphic-badge-row {
            justify-content: center !important;
        }
        #graphics-layer.layout-center-slate .graphic-content,
        #graphics-layer.layout-lower-center .graphic-content {
            align-items: center !important;
            width: 100% !important;
        }
        #graphics-layer.layout-center-slate .graphic-main-text,
        #graphics-layer.layout-lower-center .graphic-main-text {
            font-size: 32px !important;
            line-height: 1.45 !important;
            font-weight: 700 !important;
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
            letter-spacing: 0.3px !important;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.8) !important;
        }
        #graphics-layer.layout-center-slate .graphic-sub-text,
        #graphics-layer.layout-lower-center .graphic-sub-text {
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
        }

        /* Style B: Full-Center (Dead center in the middle of the screen like a sanctuary projector slide) */
        #graphics-layer.layout-full-center {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: 0 !important;
            inset: 0 !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }
        #graphics-layer.layout-full-center .graphic-card {
            max-width: 1320px !important;
            width: 88% !important;
            max-height: 86vh !important;
            margin: auto !important;
            text-align: center !important;
            align-items: center !important;
            background: linear-gradient(135deg, rgba(14, 7, 32, 0.97) 0%, rgba(28, 12, 58, 0.95) 100%) !important;
            border: 1px solid rgba(56, 189, 248, 0.55) !important;
            border-top: 6px solid #38bdf8 !important;
            border-bottom: 6px solid #f59e0b !important;
            border-left: 1px solid rgba(56, 189, 248, 0.55) !important;
            border-right: 1px solid rgba(56, 189, 248, 0.55) !important;
            border-radius: 20px !important;
            padding: 40px 56px !important;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(56, 189, 248, 0.35) !important;
            backdrop-filter: blur(25px) !important;
            transform: scale(0.96) !important;
            opacity: 0 !important;
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        #graphics-layer.layout-full-center .graphic-card.active {
            transform: scale(1) !important;
            opacity: 1 !important;
        }
        #graphics-layer.layout-full-center .graphic-card.hiding {
            transform: scale(0.96) !important;
            opacity: 0 !important;
            transition: opacity 0.2s ease, transform 0.2s ease !important;
        }
        #graphics-layer.layout-full-center .graphic-badge-row {
            justify-content: center !important;
            margin-bottom: 12px !important;
        }
        #graphics-layer.layout-full-center .graphic-badge-title {
            font-size: 16px !important;
            letter-spacing: 2px !important;
        }
        #graphics-layer.layout-full-center .graphic-content {
            align-items: center !important;
            width: 100% !important;
        }
        #graphics-layer.layout-full-center .graphic-main-text {
            font-size: 42px !important;
            line-height: 1.5 !important;
            font-weight: 700 !important;
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
            letter-spacing: 0.4px !important;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 1), 0 0 22px rgba(0, 0, 0, 0.85) !important;
        }
        #graphics-layer.layout-full-center .graphic-sub-text {
            text-align: center !important;
            white-space: pre-line !important;
            width: 100% !important;
            font-size: 18px !important;
            margin-top: 10px !important;
        }

        #graphics-layer.layout-ticker {
            padding: 0;
            align-items: flex-end;
        }
        #graphics-layer.layout-ticker .graphic-card {
            max-width: 100vw;
            width: 100vw;
            min-width: 100vw;
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
            border-top: 4px solid #f59e0b;
            padding: 12px 50px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }
        #graphics-layer.layout-ticker .graphic-content {
            flex-direction: row;
            align-items: center;
            gap: 20px;
            flex: 1;
        }
        #graphics-layer.layout-ticker .graphic-main-text {
            font-size: 20px;
        }
        #graphics-layer.layout-ticker .graphic-sub-text {
            font-size: 15px;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <!-- Permanent Church Flier Slate (Base Layer) -->
    <div id="flier-slate"></div>

    <!-- Live Video Stream Layer (Overlays Flier when Active & Authorized by Tally) -->
    <video id="obs-video" autoplay playsinline muted></video>

    <!-- Live Broadcast Graphics & Lower-Third Layer (Layer 10) -->
    <div id="graphics-layer">
        <div id="graphic-card" class="graphic-card">
            <div class="graphic-badge-row" id="graphic-badge-row">
                <span class="graphic-icon" id="graphic-icon">👤</span>
                <span class="graphic-badge-title" id="graphic-badge-title">SPEAKER</span>
                <span class="graphic-badge-tag" id="graphic-badge-tag">LIVE</span>
            </div>
            <div class="graphic-content" id="graphic-content">
                <div class="graphic-main-text" id="graphic-main-text"></div>
                <div class="graphic-sub-text" id="graphic-sub-text"></div>
            </div>
        </div>
    </div>

    <script>

        // =====================================================================
        // LIVE BROADCAST GRAPHICS CONTROLLER (LOWER-THIRDS & SCRIPTURES)
        // =====================================================================
        let overlayHideTimer = null;

        function showGraphicOverlay(payload) {
            if (isEmergency) return; // Never show over emergency flier
            if (overlayHideTimer) {
                clearTimeout(overlayHideTimer);
                overlayHideTimer = null;
            }

            const layer = document.getElementById('graphics-layer');
            const card = document.getElementById('graphic-card');
            if (layer) {
                const layout = payload.layout || 'lower-third';
                layer.className = 'layout-' + layout;
            }
            const icon = document.getElementById('graphic-icon');
            const title = document.getElementById('graphic-badge-title');
            const tag = document.getElementById('graphic-badge-tag');
            const main = document.getElementById('graphic-main-text');
            const sub = document.getElementById('graphic-sub-text');

            if (!card) return;

            const badgeRow = document.getElementById('graphic-badge-row');
            if (payload.template === 'hymn') {
                // Completely hide title and stanza on screen: ONLY LYRICS ARE BROADCAST!
                if (badgeRow) badgeRow.style.display = 'none';
            } else {
                if (badgeRow) badgeRow.style.display = 'flex';
                icon.innerText = payload.icon || '🎬';
                title.innerText = payload.badgeTitle || 'BROADCAST';
                tag.innerText = payload.badgeTag || '';
                tag.style.display = payload.badgeTag ? 'inline-block' : 'none';
            }

            main.innerText = payload.mainText || '';
            main.style.display = payload.mainText ? 'block' : 'none';
            main.style.whiteSpace = 'pre-line';

            sub.innerText = payload.subText || '';
            sub.style.display = (payload.template === 'hymn' || !payload.subText) ? 'none' : 'block';
            sub.style.whiteSpace = 'pre-line';

            // Distinct theme borders and font sizing per template & layout
            const isFullCenter = (payload.layout === 'full-center');
            const isLowerCenter = (payload.layout === 'center-slate' || payload.layout === 'lower-center');

            if (isFullCenter) {
                card.style.borderLeft = '1px solid rgba(56, 189, 248, 0.55)';
                card.style.borderTop = '6px solid #38bdf8';
                card.style.borderBottom = '6px solid #f59e0b';
                card.style.borderRight = '1px solid rgba(56, 189, 248, 0.55)';
                main.style.fontSize = '42px';
            } else if (isLowerCenter) {
                card.style.borderLeft = '1px solid rgba(56, 189, 248, 0.45)';
                card.style.borderTop = '5px solid #38bdf8';
                card.style.borderBottom = 'none';
                card.style.borderRight = 'none';
                main.style.fontSize = '32px';
            } else {
                card.style.borderTop = 'none';
                card.style.borderBottom = 'none';
                card.style.borderRight = 'none';
                if (payload.template === 'scripture') {
                    card.style.borderLeft = '6px solid #f59e0b';
                    main.style.fontSize = '26px';
                } else if (payload.template === 'hymn') {
                    card.style.borderLeft = '6px solid #38bdf8';
                    main.style.fontSize = '28px';
                } else if (payload.template === 'giving') {
                    card.style.borderLeft = '6px solid #10b981';
                    main.style.fontSize = '26px';
                } else {
                    card.style.borderLeft = '6px solid #f59e0b';
                    main.style.fontSize = '26px';
                }
            }

            const isAlreadyActive = card.classList.contains('active');
            if (isAlreadyActive) {
                const gContent = document.getElementById('graphic-content');
                if (gContent) {
                    gContent.style.opacity = '0.2';
                    setTimeout(() => {
                        gContent.style.opacity = '1';
                    }, 120);
                }
            }

            card.classList.remove('hiding');
            card.classList.add('active');

            if (payload.autoHideSeconds && payload.autoHideSeconds > 0) {
                overlayHideTimer = setTimeout(() => {
                    hideGraphicOverlay();
                }, payload.autoHideSeconds * 1000);
            }
        }

        function hideGraphicOverlay() {
            if (overlayHideTimer) {
                clearTimeout(overlayHideTimer);
                overlayHideTimer = null;
            }
            const card = document.getElementById('graphic-card');
            if (card && card.classList.contains('active')) {
                card.classList.add('hiding');
                setTimeout(() => {
                    card.classList.remove('active');
                    card.classList.remove('hiding');
                }, 350);
            }
        }

                const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || '1';
        const isProgramMode = (idParam === 'program' || idParam === 'live');
        let camId = isProgramMode ? 'program' : parseInt(idParam, 10);
        let currentProgramCamId = null; // Master Program starts safely on Church Flier
        let activeTallyState = 'OFF_AIR'; // Strict Broadcast Gate: Only 'PROGRAM' is permitted on air
        const receiverId = (isProgramMode ? 'obs_program_' : `obs_${camId}_`) + Math.random().toString(36).substring(2, 7);

        let ws = null;
        let pc = null;
        let candidateQueue = [];
        let isEmergency = false;
        let isStreamActive = false;
        let muteTimeout = null;

        const videoEl = document.getElementById('obs-video');
        const flierSlate = document.getElementById('flier-slate');

        // Robust RTC Configuration with STUN for LAN/Wi-Fi mDNS discovery
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        // Fetch Initial Church Flier Slate
        async function loadFlier() {
            try {
                const res = await fetch('/api/flier-status');
                const data = await res.json();
                if (data.url) {
                    flierSlate.style.backgroundImage = `url("${data.url}")`;
                }
                if (data.isEmergencyCut) {
                    setEmergency(true, true);
                }
            } catch (e) {
                flierSlate.style.backgroundImage = 'url("/assets/default_flier.svg")';
            }
        }
        loadFlier();

        // Reveal the permanent flier by hiding the top video layer
        function fallbackToFlier(immediate = false) {
            isStreamActive = false;
            if (immediate) {
                videoEl.classList.add('instant-cut');
                videoEl.classList.remove('live');
                setTimeout(() => {
                    videoEl.classList.remove('instant-cut');
                }, 50);
            } else {
                videoEl.classList.remove('live');
            }
        }

        // Restore video layer over the flier ONLY IF authorized by Tally
        function restoreLiveVideo() {
            if (isEmergency) return;
            // STRICT BROADCAST GATE: Never reveal video if camera is in STANDBY or OFF_AIR!
            if (activeTallyState !== 'PROGRAM') {
                console.log(`[OBS Receiver] Video decoded but Camera is in ${activeTallyState} -> Refusing live video, showing flier`);
                fallbackToFlier(true);
                return;
            }
            if (isProgramMode && !currentProgramCamId) {
                fallbackToFlier(true);
                return;
            }
            isStreamActive = true;
            videoEl.classList.add('live');
        }

        function setEmergency(active, immediate = true) {
            isEmergency = active;
            if (active) {
                fallbackToFlier(immediate);
            } else if (isStreamActive && activeTallyState === 'PROGRAM') {
                restoreLiveVideo();
            }
        }

        function initWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${window.location.host}`);

            ws.onopen = async () => {
                console.log(`[OBS Receiver] Connected as ${isProgramMode ? 'Master Program Switcher' : 'Receiver for Cam ' + camId}`);
                ws.send(JSON.stringify({
                    type: 'register',
                    role: isProgramMode ? 'program_receiver' : 'receiver',
                    camId: isProgramMode ? 'program' : camId,
                    receiverId
                }));

                // Check initial authoritative Tally state from server
                try {
                    const res = await fetch('/api/info');
                    const info = await res.json();
                    if (isProgramMode) {
                        if (info.currentProgramCamId && info.cameras[info.currentProgramCamId] && info.cameras[info.currentProgramCamId].tally === 'PROGRAM') {
                            currentProgramCamId = info.currentProgramCamId;
                            activeTallyState = 'PROGRAM';
                            requestStream(currentProgramCamId);
                        } else {
                            currentProgramCamId = null;
                            activeTallyState = 'OFF_AIR';
                            fallbackToFlier(true);
                        }
                    } else {
                        if (info.cameras[camId] && info.cameras[camId].tally === 'PROGRAM') {
                            activeTallyState = 'PROGRAM';
                            requestStream(camId);
                        } else {
                            activeTallyState = info.cameras[camId]?.tally || 'OFF_AIR';
                            fallbackToFlier(true);
                        }
                    }
                } catch (e) {
                    fallbackToFlier(true);
                }
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // Flier Image Updated
                    if (data.type === 'flier_updated') {
                        flierSlate.style.backgroundImage = `url("${data.url}")`;
                    }

                    // Live Graphics & Lower-Third Overlay Commands from Director Hub
                    if (data.type === 'overlay_show') {
                        showGraphicOverlay(data);
                    }
                    if (data.type === 'overlay_hide') {
                        hideGraphicOverlay();
                    }

                    // Emergency Panic Cut (Instant Hard Cut to Flier)
                    if (data.type === 'emergency_cut') {
                        if (data.url) flierSlate.style.backgroundImage = `url("${data.url}")`;
                        setEmergency(data.active, true);
                        if (data.active) {
                            hideGraphicOverlay();
                        }
                        if (!data.active && isProgramMode && currentProgramCamId && activeTallyState === 'PROGRAM') {
                            requestStream(currentProgramCamId);
                        }
                    }

                    // Master Program Cut Event (Director explicitly pressed CUT LIVE)
                    if (data.type === 'program_cut' && isProgramMode) {
                        if (!data.camId) {
                            currentProgramCamId = null;
                            activeTallyState = 'OFF_AIR';
                            if (pc) { try { pc.close(); } catch (e) {} pc = null; }
                            videoEl.srcObject = null;
                            fallbackToFlier(true);
                            return;
                        }
                        currentProgramCamId = parseInt(data.camId, 10);
                        activeTallyState = 'PROGRAM'; // Authoritative CUT LIVE command!
                        console.log(`[Master Program OBS] Cut Live to Camera ${currentProgramCamId}`);
                        requestStream(currentProgramCamId);
                    }

                    // Direct Tally Update from Director
                    if (data.type === 'tally_update') {
                        const targetCam = isProgramMode ? currentProgramCamId : camId;
                        if (parseInt(data.camId, 10) === targetCam) {
                            activeTallyState = data.state;
                            if (activeTallyState === 'PROGRAM') {
                                console.log(`[OBS Receiver] Camera ${data.camId} cut to PROGRAM!`);
                                if (videoEl.videoWidth > 0 && !isEmergency) {
                                    restoreLiveVideo();
                                } else {
                                    requestStream(data.camId);
                                }
                            } else {
                                console.log(`[OBS Receiver] Camera ${data.camId} demoted to ${data.state} -> Revealing Church Flier`);
                                if (pc) { try { pc.close(); } catch (e) {} pc = null; }
                                videoEl.srcObject = null;
                                fallbackToFlier(true);
                            }
                        }
                    }

                    // Broadcaster Came Online
                    if (data.type === 'broadcaster_online') {
                        const onlineId = parseInt(data.camId, 10);
                        if (!isProgramMode && onlineId === camId && activeTallyState === 'PROGRAM') {
                            requestStream(camId);
                        }
                    }

                    // Broadcaster Suspended or Went Offline
                    if (data.type === 'broadcaster_offline' || data.type === 'broadcaster_suspended') {
                        const targetId = parseInt(data.camId, 10);
                        if ((!isProgramMode && targetId === camId) || (isProgramMode && targetId === currentProgramCamId)) {
                            console.warn(`[OBS Receiver] Camera ${targetId} suspended/offline -> Revealing static flier slate`);
                            activeTallyState = 'OFF_AIR';
                            if (isProgramMode) currentProgramCamId = null;
                            if (pc) { try { pc.close(); } catch (e) {} pc = null; }
                            videoEl.srcObject = null;
                            fallbackToFlier(true);
                        }
                    }

                    // WebRTC Signaling: Offer
                    if (data.type === 'offer' && (data.receiverId === receiverId || !data.receiverId)) {
                        console.log(`[OBS Receiver] Received Offer from Phone Broadcaster`);
                        await handleOffer(data.sdp);
                    }

                    // WebRTC Signaling: ICE Candidate
                    if (data.type === 'ice-candidate' && (data.receiverId === receiverId || !data.receiverId)) {
                        await queueOrAddCandidate(data.candidate);
                    }

                } catch (e) {
                    console.error('[OBS WS Message Error]', e);
                }
            };

            ws.onclose = () => {
                fallbackToFlier(true);
                setTimeout(initWebSocket, 2000);
            };
        }

        function requestStream(targetCam) {
            const targetId = targetCam || (isProgramMode ? currentProgramCamId : camId);
            if (!targetId || activeTallyState !== 'PROGRAM') {
                fallbackToFlier(true);
                return;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'receiver_ready',
                    camId: targetId,
                    receiverId
                }));
            }
        }

        // WebRTC Offer Handler
        async function handleOffer(sdp) {
            // Guard: Never negotiate peer connection if receiver is not authorized for PROGRAM
            if (activeTallyState !== 'PROGRAM' || (isProgramMode && !currentProgramCamId)) {
                console.warn('[OBS Receiver] Offer rejected: Receiver is not cut to PROGRAM');
                fallbackToFlier(true);
                return;
            }

            if (pc) {
                try { pc.close(); } catch (e) {}
            }

            candidateQueue = [];
            pc = new RTCPeerConnection(rtcConfig);

            videoEl.muted = true;

            videoEl.onplaying = () => {
                clearTimeout(muteTimeout);
                console.log(`[OBS Receiver] Video playback active, checking Tally authorization: ${activeTallyState}`);
                if (!isEmergency && activeTallyState === 'PROGRAM' && (!isProgramMode || currentProgramCamId)) {
                    restoreLiveVideo();
                } else {
                    fallbackToFlier(true);
                }
            };

            videoEl.onloadeddata = () => {
                videoEl.muted = true;
                videoEl.play().catch(e => console.warn(e));
            };

            pc.ontrack = (event) => {
                console.log('[OBS Receiver] Video Track received!');
                videoEl.srcObject = event.streams[0];
                videoEl.muted = true;
                videoEl.play().catch(e => console.warn('Play interrupted:', e));

                event.streams[0].getVideoTracks().forEach(track => {
                    track.onended = () => {
                        console.log('[OBS Track Ended]');
                        fallbackToFlier(true);
                    };

                    // Clean signal loss debounce: reveals flier if track pauses
                    track.onmute = () => {
                        clearTimeout(muteTimeout);
                        muteTimeout = setTimeout(() => {
                            if (track.readyState === 'ended' || track.muted) {
                                console.warn('[OBS] Track muted -> Revealing static flier slate');
                                fallbackToFlier(false);
                            }
                        }, 600);
                    };

                    track.onunmute = () => {
                        clearTimeout(muteTimeout);
                        if (!isEmergency && activeTallyState === 'PROGRAM' && (!isProgramMode || currentProgramCamId)) {
                            restoreLiveVideo();
                        } else {
                            fallbackToFlier(true);
                        }
                    };
                });
            };

            pc.oniceconnectionstatechange = () => {
                console.log(`[OBS ICE State] ${pc.iceConnectionState}`);
                if (['disconnected', 'failed', 'closed'].includes(pc.iceConnectionState)) {
                    fallbackToFlier(true);
                } else if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                    if (!isEmergency && videoEl.videoWidth > 0 && activeTallyState === 'PROGRAM' && (!isProgramMode || currentProgramCamId)) {
                        restoreLiveVideo();
                    }
                }
            };

            const activeCam = isProgramMode ? currentProgramCamId : camId;

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'ice-candidate',
                        camId: activeCam,
                        receiverId,
                        candidate: event.candidate
                    }));
                }
            };

            // Set Remote Description (Phone SDP)
            await pc.setRemoteDescription(new RTCSessionDescription(sdp));

            // Flush Queued ICE Candidates that arrived early
            while (candidateQueue.length > 0) {
                const cand = candidateQueue.shift();
                try {
                    await pc.addIceCandidate(cand);
                } catch (err) {
                    console.warn('Candidate add error:', err);
                }
            }

            // Create and Send Answer
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
                type: 'answer',
                camId: activeCam,
                receiverId,
                sdp: pc.localDescription
            }));
        }

        async function queueOrAddCandidate(candidate) {
            if (!candidate) return;
            const iceCandidate = new RTCIceCandidate(candidate);
            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                try {
                    await pc.addIceCandidate(iceCandidate);
                } catch (e) {
                    console.warn('Add Candidate Error:', e);
                }
            } else {
                candidateQueue.push(iceCandidate);
            }
        }

        initWebSocket();
    </script>
</body>
