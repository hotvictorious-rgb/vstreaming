<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
            <stop offset="0%" stop-color="#2d1554" />
            <stop offset="50%" stop-color="#140a28" />
            <stop offset="100%" stop-color="#07030f" />
        </radialGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde68a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1920" height="1080" fill="url(#bgGrad)" />

    <!-- Subtle Geometric Grid / Accents -->
    <circle cx="960" cy="460" r="420" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 12" />
    <circle cx="960" cy="460" r="320" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- Cross Emblem -->
    <g transform="translate(960, 420)" filter="url(#goldGlow)">
        <!-- Vertical Bar -->
        <rect x="-14" y="-140" width="28" height="240" rx="14" fill="url(#goldGrad)" filter="url(#softShadow)" />
        <!-- Horizontal Bar -->
        <rect x="-80" y="-75" width="160" height="28" rx="14" fill="url(#goldGrad)" filter="url(#softShadow)" />
        <!-- Center Gem -->
        <circle cx="0" cy="-61" r="16" fill="#fff" opacity="0.9" />
    </g>

    <!-- Main Typography -->
    <text x="960" y="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#softShadow)">
        VICTORIOUS STREAMING HUB
    </text>

    <text x="960" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
        SANCTUARY WORSHIP SERVICE IN PROGRESS
    </text>

    <!-- Bottom Standby Status Pill -->
    <g transform="translate(960, 840)">
        <rect x="-240" y="-28" width="480" height="56" rx="28" fill="#1b1033" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" filter="url(#softShadow)" />
        <circle cx="-190" cy="0" r="8" fill="#f59e0b">
            <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="-160" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f59e0b" letter-spacing="1.5">
            CAMERA SIGNAL RESUMING SHORTLY
        </text>
    </g>

    <!-- Author & Church Footnote -->
    <text x="960" y="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
        Victorious Market Broadcast Network • CEO Victory Saviour Edet
    </text>
</svg>
